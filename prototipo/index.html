<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IFO V2 · Protótipo</title>
<meta name="description" content="Protótipo navegável do IFO V2 com dados fictícios.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%230F2B33'/%3E%3Crect x='8' y='22' width='7' height='12' fill='%2386A6FF'/%3E%3Crect x='17' y='16' width='7' height='18' fill='%236FD39A'/%3E%3Crect x='26' y='11' width='7' height='23' fill='%23FFA866'/%3E%3Ccircle cx='29.500' cy='6' r='3.200' fill='%2386A6FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --paper:#F1F5F6; --surface:#FFFFFF; --surface-2:#F6F9F9; --ink:#0F2B33; --ink-2:#46606A; --line:#D7E0E4;
  --brand:#0F5E63; --brand-ink:#FFFFFF; --brand-soft:#DCEFEF;
  --n:#1F4FD8; --l:#C2570A; --i:#13804F;
  --n-hi:#86A6FF; --l-hi:#FFA866; --i-hi:#6FD39A;
  --ok:#1D7A47; --ok-bg:#DDF3E5; --warn:#8A5600; --warn-bg:#FFF0CC; --bad:#B42318; --bad-bg:#FDE4E1;
  --hero:#0F2B33; --hero-ink:#F2F8F8; --hero-2:#A9C2C8; --hero-line:rgba(255,255,255,.14);
  --ok-hi:#7BE0A5; --warn-hi:#F6C760; --bad-hi:#FF9C90;
  --shadow:0 18px 48px rgba(10,30,36,.28);
  --lm-n:var(--n); --lm-l:var(--l); --lm-i:var(--i);
  --r:14px; color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0A1A1F; --surface:#112A31; --surface-2:#0E2328; --ink:#E7F1F3; --ink-2:#9FB8BF; --line:#25444D;
  --brand:#4CC2B3; --brand-ink:#04211E; --brand-soft:#133A3B;
  --n:#86A6FF; --l:#FFA866; --i:#6FD39A;
  --ok:#6FD39A; --ok-bg:#12372A; --warn:#F4C56A; --warn-bg:#3A2D10; --bad:#FF9A8F; --bad-bg:#40181A;
  --hero:#0D2228; --shadow:0 18px 48px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.5rem,1.2rem + 1.2vw,2rem);font-weight:800;letter-spacing:-.025em;line-height:1.15}
h2{font-size:1.125rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.hero :focus-visible,.side :focus-visible{outline-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:10px;z-index:100;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#2b0b08}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.875rem}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.loading{pointer-events:none;opacity:.85}
.btn.loading::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Forms ---------- */
.field{display:grid;gap:6px;margin-bottom:16px}
.field>label,.legend{font-weight:600;font-size:.9375rem}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=month],input[type=number],select,textarea{width:100%;min-height:46px;padding:10px 14px;border:1px solid #8CA0A8;border-radius:10px;background:var(--surface);color:var(--ink)}
:root[data-theme="dark"] input,:root[data-theme="dark"] select{border-color:#4B6A74}
input::placeholder{color:var(--ink-2);opacity:.8}
.field.has-err input,.field.has-err select{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.hint{font-size:.8125rem;color:var(--ink-2)}
.err{font-size:.875rem;color:var(--bad);font-weight:500;display:none;align-items:center;gap:6px}
.has-err .err{display:flex}
.pwrap{position:relative}
.pwrap input{padding-right:52px}
.pwrap .iconbtn{position:absolute;right:3px;top:3px}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none;font-weight:600}
.money input{padding-left:44px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg label{position:relative;display:grid;place-items:center;min-height:40px;padding:0 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:.9375rem;color:var(--ink-2);text-align:center}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg label:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.rules{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:.875rem;color:var(--ink-2)}
.rules li{display:flex;gap:8px;align-items:center}
.rules li.ok{color:var(--ok)}
.rules li .i{width:16px;height:16px;opacity:.45}.rules li.ok .i{opacity:1}
.opt{display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--brand);box-shadow:0 0 0 1px var(--brand);background:var(--brand-soft)}
.opt:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.opt input{position:absolute;opacity:0}
.opt b{font-size:.9375rem}.opt small{color:var(--ink-2)}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--hero);color:var(--hero-ink);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--hero-line)}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:800;font-size:1.5rem;letter-spacing:.02em}
.logo svg{width:38px;height:38px}
.side .logo{--lm-n:var(--n-hi);--lm-l:var(--l-hi);--lm-i:var(--i-hi);padding:0 10px 18px}
.side nav{display:grid;gap:2px}
.side hr{border:0;border-top:1px solid var(--hero-line);margin:8px 10px;width:auto}
.nl{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--hero-2);text-decoration:none;font-weight:600;font-size:.9375rem}
.nl:hover{background:rgba(255,255,255,.07);color:#fff}
.nl[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff}
.nl .tag{margin-left:auto;font-size:.6875rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--i-hi);color:#08301c}
.side .foot{margin-top:auto;display:grid;gap:2px}
.me{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-top:6px;border-top:1px solid var(--hero-line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--n-hi);color:#0b1b4d;display:grid;place-items:center;font-weight:800}
.me small{display:block;color:var(--hero-2);font-size:.75rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.me b{font-size:.9375rem;line-height:1.2}
.main-col{min-width:0}
main{padding:28px clamp(16px,3vw,40px) 64px;max-width:1180px;margin:0 auto}
main:focus,main:focus-visible{outline:none}
.auth main.formp{max-width:none;margin:0}
.phead{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:24px}
.phead .sub{color:var(--ink-2);margin-top:4px;max-width:60ch}
.pact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px}
.stepper button{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;border-radius:11px;color:var(--ink)}
.stepper button:hover{background:var(--surface-2)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper span{min-width:132px;text-align:center;font-weight:700}
.stepper span::first-letter{text-transform:uppercase}
.mtop,.tabbar{display:none}

/* ---------- Surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel>.ph{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-hero{display:grid;gap:16px;margin-bottom:16px}
.stack{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.8125rem;font-weight:600;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.chip .i{width:14px;height:14px}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.gN{--c:var(--n)}.gL{--c:var(--l)}.gI{--c:var(--i)}
.chip.g{background:transparent;border-color:transparent;padding-left:0}
.chip.g::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:clamp(20px,3vw,32px);display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);align-items:center;border:1px solid var(--hero-line)}
.ringwrap{display:grid;gap:12px;justify-items:center;max-width:230px}
.ringcap{margin:0;font-size:.8125rem;color:var(--hero-2);text-align:center;line-height:1.35}
.ringbox{position:relative;width:216px;height:216px}
.ringbox svg{width:100%;height:100%}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-size:2.25rem;letter-spacing:-.03em;line-height:1}
.ring-c span{font-size:.8125rem;color:var(--hero-2);max-width:9ch;margin:4px auto 0;line-height:1.25}
.arc{transition:stroke-dasharray 1.1s cubic-bezier(.2,.7,.2,1)}
.hero h2{color:var(--hero-2);font-size:.9375rem;font-weight:600;letter-spacing:0}
.bignum{font-size:clamp(2.5rem,2rem + 2.5vw,3.75rem);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:2px 0 14px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:22px}
.stats div{display:grid}
.stats small{color:var(--hero-2);font-size:.8125rem}
.stats b{font-size:1.125rem}
.legend-rows{display:grid;gap:2px;border-top:1px solid var(--hero-line)}
.lrow{display:grid;grid-template-columns:auto 1fr auto 16px;gap:12px;align-items:center;padding:10px 8px;margin:0 -8px;border:0;border-bottom:1px solid var(--hero-line);background:transparent;color:inherit;width:calc(100% + 16px);text-align:left;cursor:pointer;border-radius:10px;transition:background .15s}
.lrow:hover{background:rgba(255,255,255,.08)}
.lrow:hover>.i{transform:translateX(3px)}
.lrow>.i{opacity:.6;transition:transform .15s}
.lrow .dotc{--c:var(--x)}
.lrow .st{font-size:.8125rem;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.lrow .st.ok{color:var(--ok-hi)}.lrow .st.warn{color:var(--warn-hi)}.lrow .st.bad{color:var(--bad-hi)}
.lrow .v{color:var(--hero-2);font-size:.875rem}
.lrow .v b{color:var(--hero-ink)}
.alertbar{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;border:1px solid transparent;margin-bottom:16px}
.alertbar.warn{background:var(--warn-bg);color:var(--warn)}
.alertbar.bad{background:var(--bad-bg);color:var(--bad)}
.alertbar.info{background:var(--brand-soft);color:var(--brand)}
.alertbar p{flex:1;color:inherit;font-weight:500}
.alertbar a{color:inherit;font-weight:700;white-space:nowrap}
.chartbox{position:relative;height:250px}
.plegend{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-size:.9rem}
.plegend li{display:flex;gap:8px;align-items:center}
.plegend li span:last-child{margin-left:auto;font-weight:600}
.tabs{display:inline-flex;gap:4px}
.tabs button{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:600;font-size:.875rem;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* tx list */
.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:12px}
.filters .field{margin:0}
.filters label{font-size:.8125rem;color:var(--ink-2);font-weight:600}
.sumbar{display:flex;flex-wrap:wrap;gap:6px 24px;margin:16px 0 8px;color:var(--ink-2);font-size:.9375rem}
.sumbar b{color:var(--ink)}
.txlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tx{display:grid;grid-template-columns:12px minmax(0,1fr) 140px 64px 120px auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx:hover{background:var(--surface-2)}
.tx .main{min-width:0;display:grid}
.tx .main strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .main small{color:var(--ink-2)}
.tx time{color:var(--ink-2);font-size:.9rem}
.tx .chip{justify-self:start}
.amt{text-align:right;font-weight:700}
.amt.receita{color:var(--ok)}
.tx.prev{background:repeating-linear-gradient(135deg,transparent 0 10px,var(--surface-2) 10px 20px)}
.tx .acts{display:flex;gap:2px;justify-content:flex-end}
.empty{display:grid;justify-items:start;gap:10px;padding:36px 24px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{font-size:1.125rem}
.empty p{color:var(--ink-2);max-width:52ch}
.empty svg.big{width:40px;height:40px;color:var(--brand)}

/* budgets */
.brow{display:grid;grid-template-columns:200px 1fr auto;gap:20px;align-items:center;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.brow+.brow{margin-top:12px}
.brow .name{display:grid;gap:6px;justify-items:start}
.brow .name h3{display:flex;align-items:center;gap:8px}
.bar{position:relative;height:14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--c);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar i.bad{background:var(--bad)}
.bar b{position:absolute;left:80%;top:-5px;bottom:-5px;width:3px;background:var(--ink);opacity:.75;border-radius:2px}
.bar b::after{content:"aviso 80%";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);font-size:.6875rem;font-weight:700;font-style:normal;color:var(--ink-2);white-space:nowrap}
.brow .bar{margin-top:16px}
.bnote{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:.9rem;color:var(--ink-2);flex-wrap:wrap}
.bnote b{color:var(--ink)}
.suggest{display:grid;gap:14px;padding:24px;background:var(--brand-soft);border-radius:var(--r);border:1px solid transparent}
.suggest ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.suggest li{display:flex;gap:10px;align-items:center}
.suggest li b{margin-left:auto}

.pctb{text-align:right}.pctb b{font-size:1.5rem;letter-spacing:-.02em}.pctb small{display:block;color:var(--ink-2)}
.pcts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:8px}
.pin{position:relative}.pin input{padding-right:40px}
.pin span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-weight:600;pointer-events:none}
.pcts .field>label{display:flex;gap:8px;align-items:center}
.pcts .dotc{background:var(--c)}
.pcact{display:flex;gap:10px;flex-wrap:wrap}
.plbtn{width:100%;display:flex;gap:8px;align-items:center;text-align:left;min-height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;color:inherit;transition:border-color .15s,background .15s,transform .15s}
.plbtn:hover{background:var(--brand-soft);border-color:var(--brand)}
.plbtn::after{content:"";width:8px;height:8px;border-top:2px solid var(--ink-2);border-right:2px solid var(--ink-2);transform:rotate(45deg);flex:none;margin-left:2px}
.plbtn:hover::after{border-color:var(--brand);transform:rotate(45deg) translate(2px,-2px)}
.plegend{gap:6px}
.plbtn span:last-child{margin-left:auto;font-weight:600}
.plegend li{display:block}
.reclist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rec{display:grid;grid-template-columns:12px minmax(0,1fr) 130px 110px 150px auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.rec.hl{animation:hl 2.2s ease-out}
@keyframes hl{0%,40%{background:var(--brand-soft)}100%{background:transparent}}
.rec.off{background:var(--surface-2)}.rec.off .main,.rec.off .amt{opacity:.65}
.rec .main{min-width:0;display:grid}.rec .main small{color:var(--ink-2)}
.rec .nxt{font-size:.9rem;color:var(--ink-2)}.rec .nxt b{color:var(--ink)}
.rec .acts{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.simtab{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.simtab summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.tabwrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.tabwrap table{width:100%;border-collapse:collapse;font-size:.9rem}
.tabwrap th,.tabwrap td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line)}
.tabwrap thead th{position:sticky;top:0;background:var(--surface-2);font-weight:700}
.tabwrap th:first-child,.tabwrap td:first-child{text-align:left}
/* goals */
.goal{display:grid;grid-template-columns:1fr auto;gap:8px 20px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.goal+.goal{margin-top:12px}
.goal .bar{grid-column:1/-1;--c:var(--brand)}
.goal .bar.done{--c:var(--ok)}
.goal .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 24px;color:var(--ink-2);font-size:.9375rem}
.goal .meta b{color:var(--ink)}
.goal .gact{display:flex;gap:6px;align-items:flex-start}

/* simulator */
.sim{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
.resnums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.resnums div{display:grid;gap:2px}
.resnums small{color:var(--ink-2)}
.resnums b{font-size:1.5rem;letter-spacing:-.02em}
.resnums .final b{font-size:2rem;color:var(--brand)}

/* analysis */
.insight{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.insight:last-child{border:0}
.insight .badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.insight .badge.up{background:var(--bad-bg);color:var(--bad)}
.insight .badge.down{background:var(--ok-bg);color:var(--ok)}
.insight .badge.neu{background:var(--brand-soft);color:var(--brand)}
.cmp{display:grid;gap:12px}
.cmp .r{display:grid;grid-template-columns:130px 1fr 120px;gap:12px;align-items:center;font-size:.9375rem}
.cmp .bars{display:grid;gap:4px}
.cmp .bars i{display:block;height:9px;border-radius:99px;background:var(--c)}
.cmp .bars i.p{opacity:.38}
.cmp .vals{text-align:right;font-size:.8125rem;color:var(--ink-2)}
.cmp .vals b{color:var(--ink)}

/* activity */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day{font-weight:700;margin:20px 0 8px;color:var(--ink-2);font-size:.9375rem}
.alist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.alist li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.alist li:last-child{border:0}
.alist .badge{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.alist time{color:var(--ink-2);font-size:.875rem}

/* chat */
.chat{display:grid;grid-template-rows:auto 1fr auto;height:calc(100vh - 220px);min-height:480px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chat .top{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--warn-bg);color:var(--warn);display:flex;gap:10px;align-items:flex-start;font-size:.875rem;font-weight:500}
.chat .log{overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{max-width:min(620px,88%);padding:12px 16px;border-radius:16px;line-height:1.5}
.msg.user{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .rate{display:flex;gap:4px;margin-top:8px;align-items:center;font-size:.8125rem;color:var(--ink-2)}
.msg .rate button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.msg .rate button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.msg.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.chat form{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:10px}
.chat .sugs{display:flex;gap:8px;flex-wrap:wrap}
.chat .sugs button{min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:99px;cursor:pointer;font-size:.875rem;font-weight:500}
.chat .sugs button:hover{border-color:var(--brand);color:var(--brand)}
.chat .inrow{display:flex;gap:10px}
.chat .meta{display:flex;justify-content:space-between;color:var(--ink-2);font-size:.8125rem}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth .brandp{background:var(--hero);color:var(--hero-ink);padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.brandp{--lm-n:var(--n-hi);--lm-l:var(--l-hi);--lm-i:var(--i-hi)}
.brandp .logo{font-size:1.75rem}
.brandp h2{font-size:clamp(1.75rem,1.2rem + 2vw,2.75rem);font-weight:800;letter-spacing:-.035em;line-height:1.08;max-width:15ch;color:var(--hero-ink)}
.brandp p{color:var(--hero-2);max-width:40ch;margin-top:14px}
.brandp .deco{width:min(280px,56%)}
.auth .formp{display:grid;place-items:center;padding:32px clamp(16px,5vw,64px)}
.auth .box{width:100%;max-width:400px}
.auth .box h1{margin-bottom:6px}
.auth .box>p{color:var(--ink-2);margin-bottom:24px}
.auth .alt{margin-top:20px;text-align:center;color:var(--ink-2)}
.demo{margin-top:18px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:.875rem;color:var(--ink-2);display:flex;gap:10px;justify-content:space-between;align-items:center}
.formerr{display:none;margin-bottom:16px;padding:12px 14px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-weight:500;gap:10px}
.formerr.show{display:flex}
.codes{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 12px}
.codes input{min-height:56px;text-align:center;font-size:1.5rem;font-weight:700;padding:0}
.tk{display:flex;justify-content:space-between;font-size:.9rem;color:var(--ink-2);margin-bottom:16px;gap:12px;flex-wrap:wrap}

/* dialog + toast */
dialog{border:0;border-radius:20px;padding:0;width:min(540px,calc(100% - 24px));max-height:calc(100vh - 24px);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog[open]{animation:pop .18s ease-out}
dialog::backdrop{background:rgba(6,20,25,.6)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 4px}
.db{padding:12px 20px 4px}
.df{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 20px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line)}
dialog form{display:contents}
.df .btn{flex:0 1 auto}
.toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:200;width:min(420px,calc(100% - 24px))}
.toast{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--shadow);animation:pop .2s ease-out}
.toast .i{flex:none}
.toast span{flex:1;font-weight:500}
.toast.success .i:first-child{color:#6FD39A}
.toast.warn .i:first-child{color:#F6C760}
.toast.error .i:first-child{color:#FF9C90}
.toast button{background:transparent;border:0;color:inherit;cursor:pointer;min-height:36px;padding:0 8px;border-radius:8px;font-weight:700;text-decoration:underline}
.toast button.x{text-decoration:none;display:grid;place-items:center;width:36px;padding:0}
.sheet a.nl{color:var(--ink);}
.sheet .nl:hover{background:var(--surface-2);color:var(--ink)}
.sheet .nl[aria-current=page]{background:var(--brand-soft);color:var(--brand)}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Responsive ---------- */
@media (max-width:1100px){
  .grid2{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}

}

  .mtop .logo{--lm-n:var(--n-hi);--lm-l:var(--l-hi);--lm-i:var(--i-hi);font-size:1.25rem}
  .mtop .logo svg{width:28px;height:28px}
  .mtop .iconbtn{color:var(--hero-2)}.mtop .iconbtn:hover{background:rgba(255,255,255,.1);color:#fff}
  main{padding:20px 16px 110px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));align-items:end}
  .tabbar a,.tabbar button.tb{display:grid;justify-items:center;gap:2px;min-height:52px;padding:6px 2px;border:0;background:transparent;color:var(--ink-2);text-decoration:none;font-size:.6875rem;font-weight:600;cursor:pointer;border-radius:10px}
  .tabbar a[aria-current="page"]{color:var(--brand)}
  .tabbar .fab{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:0;display:grid;place-items:center;margin:-22px auto 0;box-shadow:var(--shadow);cursor:pointer}
  .tabbar .fab .i{width:26px;height:26px}
  .toasts{bottom:92px;right:12px;left:12px;width:auto}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:left}
  .hero>div:last-child{width:100%}
  .pact .btn.primary[data-act="nova-tx"]{display:none}
  .pact{width:100%}
  .goal{grid-template-columns:1fr}
  .goal .gact{flex-wrap:wrap}
  .phead{align-items:flex-start}
  .tx{grid-template-columns:12px minmax(0,1fr) auto;grid-template-areas:"d m a" "d c t" "d x x";gap:4px 12px;padding:14px 16px}
  .tx .dotc{grid-area:d;align-self:start;margin-top:7px}
  .tx .main{grid-area:m}
  .tx .chip{grid-area:c;justify-self:start}
  .tx time{grid-area:t;justify-self:end}
  .tx .amt{grid-area:a}
  .tx .acts{grid-area:x;justify-content:flex-start}
  .tx .chip.g,.tx time{font-size:.8125rem}
  .brow{grid-template-columns:1fr;gap:12px}
  .pcts{grid-template-columns:1fr}
  .pctb{text-align:left}
  .rec{grid-template-columns:12px minmax(0,1fr) auto;grid-template-areas:"d m a" "d c n" "d x x";gap:4px 12px}
  .rec .dotc{grid-area:d;align-self:start;margin-top:7px}.rec .main{grid-area:m}.rec .amt{grid-area:a}.rec .chip{grid-area:c;justify-self:start}.rec .nxt{grid-area:n;text-align:right}.rec .acts{grid-area:x;justify-content:flex-start;margin-top:4px}
  .stepper{max-width:100%}
  .pact .seg{width:100%}
  .auth{grid-template-columns:1fr}
  .auth .brandp{padding:24px 20px;gap:12px}
  .auth .brandp .deco,.auth .brandp p{display:none}
  .auth .brandp h2{font-size:1.5rem;max-width:22ch}
  .resnums{grid-template-columns:1fr}
  .cmp .r{grid-template-columns:1fr;gap:4px}
  .cmp .vals{text-align:left}
  .chat{height:calc(100vh - 250px)}
  dialog{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;width:100%;max-height:92vh}
  dialog.centered{margin:auto;border-radius:20px;width:calc(100% - 24px)}
  .row2{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}
}
@media (max-width:420px){
  .ringbox{width:188px;height:188px}
  .ring-c b{font-size:1.625rem}.ring-c span{font-size:.6875rem;max-width:8ch}
  .stats{gap:8px 20px}
  .stepper span{min-width:112px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const pad=n=>String(n).padStart(2,'0');

const MC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;

const fmtNum=n=>new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);

/* ---------- catálogo (escopo, seção 6.1) ---------- */

const PER={mes:{n:1,l:'Mês'},tri:{n:3,l:'Trimestre'},sem:{n:6,l:'Semestre'},ano:{n:12,l:'Ano'}};
function rangeOf(mode=S.per,anchor=S.mes){
  const n=PER[mode].n,y=anchor.y,m0=Math.floor(anchor.m/n)*n,keys=[];
  for(let i=0;i<n;i++)keys.push(ymKey(y,m0+i));
  const label=mode==='mes'?`${MESES[anchor.m]} ${y}`:mode==='tri'?`${m0/3+1}º trimestre de ${y}`:mode==='sem'?`${m0/6+1}º semestre de ${y}`:`${y}`;
  const short=mode==='mes'?MESES[anchor.m]:mode==='tri'?`${m0/3+1}º trimestre`:mode==='sem'?`${m0/6+1}º semestre`:String(y);
  return {mode,n,y,m0,keys,label,short};
}

const monthList=k=>S.tx.filter(t=>t.data.startsWith(k));
function agg(list){
  const o={rec:0,desp:0,g:{Necessidades:0,Lazer:0,Investimentos:0},c:{},prevRec:0,prevDesp:0};
  for(const t of list){
    if(t.confirmada){
      if(t.tipo==='receita')o.rec+=t.valor;
      else{o.desp+=t.valor;o.g[t.grupo]=(o.g[t.grupo]||0)+t.valor;o.c[t.categoria]=(o.c[t.categoria]||0)+t.valor}
    }else{ if(t.tipo==='receita')o.prevRec+=t.valor;else o.prevDesp+=t.valor }
  }
  return o;
}
/* orçamento por percentuais (RF15): o mês novo herda o percentual do mês anterior */
const DEF={Necessidades:50,Lazer:30,Investimentos:20};
const pctFor=k=>{const ks=Object.keys(S.pct).filter(x=>x<=k).sort();return ks.length?S.pct[ks[ks.length-1]]:DEF};
const ideal=(g,k=CUR_KEY)=>S.user.renda*pctFor(k)[g]/100;
const idealP=(g,keys)=>keys.reduce((s,k)=>s+ideal(g,k),0);
const semRenda=()=>!(S.user.renda>0);
const stat=p=>p>100?{k:'bad',t:'Limite ultrapassado',i:'alert'}:p>=80?{k:'warn',t:'Perto do limite',i:'alert'}:{k:'ok',t:'Dentro do limite',i:'check'};
/* recorrências (RF11): gera as vencidas, inclusive meses perdidos, sem duplicar */
function gerarRecs(){
  let n=0;
  for(const r of S.recs){
    if(!r.ativa)continue;
    let [y,m]=(r.ultima?r.ultima:prevKey(r.inicio)).split('-').map(Number);   // m (1-based) já é o índice do mês seguinte
    if(m>11){m=0;y++}
    for(;;){
      const k=ymKey(y,m);
      if(k>CUR_KEY||(r.fim&&k>r.fim))break;
      const data=iso(y,m,Math.min(r.dia,dim(y,m)));
      if(k===CUR_KEY&&data>TODAY_ISO)break;
      if(!S.tx.some(t=>t.recorrenciaId===r.id&&t.data.startsWith(k))){S.tx.push({id:nextId(),tipo:'despesa',grupo:r.grupo,categoria:r.categoria,descricao:r.descricao,valor:r.valor,data,confirmada:true,recorrenciaId:r.id});n++}
      r.ultima=k;m++;if(m>11){m=0;y++}
    }
  }
  return n;
}

const catGroup=n=>{for(const g of G)if(CATS[g].includes(n))return g;const c=S.cats.find(c=>c.nome===n&&c.grupo);return c?c.grupo:null};

function budgetCheck(t,before){
  if(t.tipo!=='despesa'||!t.confirmada)return;
  const k=t.data.slice(0,7),lim=ideal(t.grupo,k);if(!(lim>0))return;
  const a=agg(monthList(k)).g[t.grupo],p=a/lim*100,pb=(a-(before?0:t.valor))/lim*100;
  if(p>100&&pb<=100)toast(`O orçamento de ${t.grupo} passou do limite: ${Math.round(p)}% usado. A transação foi salva.`,{tipo:'error',action:{label:'Ver orçamento',fn:()=>{location.hash='#/orcamentos'}},ms:8000});
  else if(p>=80&&pb<80)toast(`${t.grupo} chegou a ${Math.round(p)}% do orçamento. Faltam ${brl(lim-a)}.`,{tipo:'warn',action:{label:'Ver orçamento',fn:()=>{location.hash='#/orcamentos'}},ms:8000});
}

/* ---------- toasts e diálogos ---------- */
/* retorno sonoro e tátil opcional (preferência salva no navegador) */
let _ac=null;
function sinal(tipo){
  try{if(localStorage.getItem('ifo-som')!=='1')return}catch(e){return}
  try{if(navigator.vibrate)navigator.vibrate(tipo==='success'?[30]:[60,40,60])}catch(e){}
  try{_ac=_ac||new (window.AudioContext||window.webkitAudioContext)();const o=_ac.createOscillator(),g=_ac.createGain();o.type='sine';o.frequency.value=tipo==='success'?880:tipo==='warn'?520:300;g.gain.value=.06;o.connect(g);g.connect(_ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+.18);o.stop(_ac.currentTime+.2)}catch(e){}
}
function toast(msg,{tipo='success',action=null,ms=4500}={}){
  sinal(tipo);
  const box=$('#toasts');while(box.children.length>=2)box.firstChild.remove();
  const el=document.createElement('div');el.className='toast '+tipo;
  el.setAttribute('role',tipo==='error'?'alert':'status');
  el.innerHTML=`${ico(tipo==='success'?'check':tipo==='info'?'info':'alert')}<span>${esc(msg)}</span>${action?`<button type="button" class="act">${esc(action.label)}</button>`:''}<button type="button" class="x" aria-label="Fechar aviso">${ico('x','sm')}</button>`;
  const close=()=>el.remove();let timer=setTimeout(close,ms);
  el.addEventListener('mouseenter',()=>clearTimeout(timer));el.addEventListener('mouseleave',()=>timer=setTimeout(close,2500));
  $('.x',el).onclick=close;
  if(action)$('.act',el).onclick=()=>{action.fn();close()};
  $('#toasts').appendChild(el);
}

function showErrors(form,errs){
  $$('.field',form).forEach(f=>{f.classList.remove('has-err');const i=$('input,select',f);if(i)i.removeAttribute('aria-invalid');const x=$('.err',f);if(x)x.innerHTML=''});
  let first=null;
  for(const [k,msg] of Object.entries(errs)){
    const f=$(`[data-f="${k}"]`,form);if(!f)continue;
    f.classList.add('has-err');const i=$('input,select',f);if(i){i.setAttribute('aria-invalid','true');first=first||i}
    $('.err',f).innerHTML=`${ico('alert','sm')}${esc(msg)}`;
  }
  if(first)first.focus();
  return !Object.keys(errs).length;
}

function ringSVG(vals,animate){

    return `<circle cx="100" cy="100" r="${r}" stroke="var(--hero-line)"/>${vals[g]>0.4?`<circle class="arc" data-c="${C}" data-p="${p}" cx="100" cy="100" r="${r}" stroke="${vals[g]>100?'var(--bad-hi)':`var(${GH[g]})`}" stroke-dasharray="${animate?`0 ${C}`:`${p} ${C}`}"/>`:''}`}).join('');
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Anel do 50/30/20: ${G.map(g=>`${g} ${Math.round(vals[g])}% do ideal`).join(', ')}"><g fill="none" stroke-width="14" stroke-linecap="round" transform="rotate(-90 100 100)">${arcs}</g></svg>`;
}

function goalCalc(m){
  const meses=Math.max(1,(parseInt(m.prazo.slice(0,4))-2026)*12+(parseInt(m.prazo.slice(5,7))-11));
  const falta=Math.max(0,m.objetivo-m.atual);return {meses,falta,mensal:falta/meses,pct:Math.min(100,m.atual/m.objetivo*100)};
}
function goalMini(m){const c=goalCalc(m);return `<div><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(m.titulo)}</h3><b>${Math.round(c.pct)}%</b></div>

const SIM={modo:'ambos',tipo:'compostos',ini:'1.000,00',ap:'300,00',taxa:'0,9',tu:'mes',prazo:'24',pu:'meses'};
function simular(p){
  const n=Math.round(p.pu==='anos'?p.prazo*12:p.prazo),a=p.taxa/100;
  const i=p.tu==='ano'?(p.tipo==='compostos'?Math.pow(1+a,1/12)-1:a/12):a;
  const ini=p.modo==='aporte'?0:p.ini,ap=p.modo==='unica'?0:p.ap;
  const serie=[];let bal=ini;
  for(let t=0;t<=n;t++){let total;
    if(p.tipo==='compostos'){if(t>0)bal=bal*(1+i)+ap;total=bal}
    else total=ini*(1+i*t)+ap*t+ap*i*t*(t-1)/2;
    serie.push({t,inv:ini+ap*t,total})}
  const l=serie[n];return {n,serie,final:l.total,inv:l.inv,juros:l.total-l.inv};
}
function simInputs(){
  const p={modo:SIM.modo,tipo:SIM.tipo,ini:parseMoney(SIM.ini||'0'),ap:parseMoney(SIM.ap||'0'),taxa:parseMoney(SIM.taxa),tu:SIM.tu,prazo:parseMoney(SIM.prazo),pu:SIM.pu};
  const e={};
  if(p.modo!=='aporte'&&(isNaN(p.ini)||p.ini<0))e.ini='Informe um valor de 0 em diante.';
  if(p.modo!=='aporte'&&p.modo==='unica'&&!(p.ini>0))e.ini='Informe quanto você vai aplicar.';
  if(p.modo!=='unica'&&(isNaN(p.ap)||p.ap<=0))e.ap='Informe o valor do aporte mensal.';
  if(isNaN(p.taxa)||p.taxa<=0||p.taxa>100)e.taxa='Informe uma taxa entre 0,01% e 100%.';
  const meses=p.pu==='anos'?p.prazo*12:p.prazo;
  if(isNaN(meses)||meses<1||meses>1200)e.prazo='O prazo vai de 1 a 1.200 meses (100 anos).';
  return {p,e};
}

    ${ins.length?ins.map(x=>`<div class="insight"><span class="badge ${x.pr===0||x.d>0?'up':'down'}">${ico(x.pr===0||x.d>0?'trend':'check')}</span><p>${txtIns(x)}</p></div>`).join(''):`<p class="muted" style="padding:14px 0">Nenhuma mudança relevante em relação a ${lbl}.</p>`}

function pctLive(f){
  if(!f)return;const v={};G.forEach(g=>v[g]=parseInt(f.elements[g].value,10));
  const sum=G.reduce((s,g)=>s+(isNaN(v[g])?0:v[g]),0);
  G.forEach(g=>{const h=$(`#p-${g}-h`);if(h)h.textContent=isNaN(v[g])?'Informe um número de 0 a 100':pctHint(g,v[g],selKey())});
  const b=$('#pctsum');b.className='alertbar '+(sum===100?'info':'warn');b.innerHTML=pctSumHTML(sum);
}
function txHint(f){
  const box=$('#orchint');if(!box)return;box.hidden=true;
  const tipo=f.elements.tipo.value,valor=parseMoney(f.valor.value),data=f.data.value,grupo=f.grupo.value;
  if(tipo!=='despesa'||f.prevista.checked||!(valor>0)||!data)return;
  const k=data.slice(0,7),lim=ideal(grupo,k);if(!(lim>0))return;
  const id=Number(f.dataset.id)||null,old=id?S.tx.find(x=>x.id===id):null;
  let used=agg(monthList(k)).g[grupo];if(old&&old.tipo==='despesa'&&old.confirmada&&old.grupo===grupo&&old.data.startsWith(k))used-=old.valor;
  const p=(used+valor)/lim*100;if(p<80)return;
  box.className='alertbar '+(p>100?'bad':'warn');
  box.innerHTML=`${ico('alert')}<p>${p>100?`Com esta despesa, ${grupo} passa do limite: ${Math.round(p)}% de ${brl0(lim)}.`:`Com esta despesa, ${grupo} chega a ${Math.round(p)}% do limite.`} Você pode salvar mesmo assim.</p>`;box.hidden=false;
}

const SUGS=['Quanto gastei com Lazer este mês?','Qual foi meu maior gasto?','Como está meu orçamento?','Qual é o meu saldo?'];
function respond(q){
  const t=norm(q),a=agg(monthList(CUR_KEY)),renda=S.user.renda;
  const g=G.find(x=>t.includes(norm(x)));
  const cat=allCats('despesa').find(c=>t.includes(norm(c.replace(/\s*\(.*\)/,''))));
  if(cat&&!g){const v=a.c[cat]||0;return `Em novembro você gastou ${brl(v)} em ${cat}${v?`, ${Math.round(v/a.desp*100)}% de todas as suas despesas do mês (${brl(a.desp)})`:''}.`}
  if(g){const v=a.g[g],id=ideal(g);return id>0?`Em novembro você gastou ${brl(v)} com ${g}. Com ${pctFor(CUR_KEY)[g]}% da sua renda de ${brl(renda)}, o limite desse grupo é ${brl(id)}, então você usou ${Math.round(v/id*100)}% dele.`:`Em novembro você gastou ${brl(v)} com ${g}. Informe a sua renda no perfil para eu comparar com o limite.`}
  if(/maior|mais gast|top/.test(t)){const e=Object.entries(a.c).sort((x,y)=>y[1]-x[1])[0];return e?`Sua maior categoria de gasto em novembro é ${e[0]}, com ${brl(e[1])} (${Math.round(e[1]/a.desp*100)}% das despesas).`:'Ainda não há despesas registradas em novembro.'}
  if(/orcamento|limite/.test(t)){if(semRenda())return 'Sua renda mensal está em R$ 0,00, então ainda não há limites calculados. Informe a renda no perfil.';const l=G.map(x=>{const lim=ideal(x);return `${x}: ${brl(a.g[x])} de ${brl(lim)} (${Math.round(a.g[x]/lim*100)}%)`});return `Seus limites de novembro: ${l.join('; ')}.`}
  if(/saldo|sobrou|sobra/.test(t))return `Seu saldo de novembro até hoje é ${brl(a.rec-a.desp)}: receitas de ${brl(a.rec)} menos despesas de ${brl(a.desp)}.`;
  if(/meta|objetivo/.test(t)){const m=S.metas.filter(x=>!x.concluida);return m.length?`Você tem ${m.length} meta${m.length>1?'s':''} em andamento: ${m.map(x=>`${x.titulo} (${Math.round(x.atual/x.objetivo*100)}%)`).join('; ')}.`:'Você não tem metas em andamento.'}
  return 'Não encontrei essa informação nos seus totais. Posso responder sobre gastos por grupo ou categoria, saldo, orçamentos e metas do mês.';
}
function chatMsgs(){
  if(!S.ia.msgs.length&&!S.ia.busy)return `<div class="msg ai">Oi, ${esc(S.user.nome)}! Eu respondo dúvidas sobre os seus números de novembro. Só leio os totais, não altero nada na sua conta.</div>`;
  return S.ia.msgs.map(m=>m.role==='user'?`<div class="msg user">${esc(m.text)}</div>`:m.err?`<div class="msg ai err" role="alert">${ico('alert','sm')} ${esc(m.text)} <button class="btn sm" data-act="ia-retry" style="margin-left:8px">Tentar de novo</button></div>`:`<div class="msg ai">${esc(m.text)}<div class="rate"><span>Essa resposta ajudou?</span><button data-act="ia-rate" data-id="${m.id}" data-v="up" aria-pressed="${m.rating==='up'}" aria-label="Resposta útil">${ico('up','sm')}</button><button data-act="ia-rate" data-id="${m.id}" data-v="down" aria-pressed="${m.rating==='down'}" aria-label="Resposta não ajudou">${ico('down','sm')}</button></div></div>`).join('')+(S.ia.busy?`<div class="msg ai" aria-label="O assistente está consultando seus totais"><span class="typing"><i></i><i></i><i></i></span></div>`:'');
}
function pgAssistente(){
  const left=20-S.ia.usadas;
  return pageHead('Assistente',{sub:'Tire dúvidas sobre os seus números em linguagem natural. Recurso em teste.',newTx:false})+`
  <section class="chat" aria-label="Conversa com o assistente">
   <div class="top">${ico('info')}<span>As respostas usam só totais do mês, sem nome, e-mail nem descrições. É uma ajuda para entender seus números, não aconselhamento financeiro.</span></div>
   <div class="log" id="chatlog" role="log" aria-live="polite">${chatMsgs()}</div>
   <form data-form="chat" novalidate><div class="sugs">${SUGS.map(s=>`<button type="button" data-act="ia-sug" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="inrow"><label class="sr" for="chatq">Sua pergunta</label><input id="chatq" type="text" maxlength="200" placeholder="${left>0?'Pergunte sobre os seus gastos':'Limite de hoje atingido'}" ${left<=0?'disabled':''} autocomplete="off"><button class="btn primary" type="submit" ${left<=0?'disabled':''} aria-label="Enviar pergunta">${ico('send')}</button></div>
    <div class="meta"><span id="iaquota">${left>0?`${left} de 20 perguntas restantes hoje`:'Você usou as 20 perguntas de hoje. Elas voltam amanhã.'}</span><span>Máx. 200 caracteres</span></div></form>
  </section>`;
}
function chatRefresh(){const l=$('#chatlog');if(!l)return;l.innerHTML=chatMsgs();l.scrollTop=l.scrollHeight;const left=20-S.ia.usadas;const q=$('#iaquota');if(q)q.textContent=left>0?`${left} de 20 perguntas restantes hoje`:'Você usou as 20 perguntas de hoje. Elas voltam amanhã.';const i=$('#chatq');if(i){i.disabled=left<=0||S.ia.busy}}
async function ask(q){
  q=q.trim();if(!q||S.ia.busy||S.ia.usadas>=20)return;
  S.ia.msgs.push({role:'user',text:q,id:nextId()});S.ia.busy=true;S.ia.last=q;chatRefresh();
  const t0=performance.now();await delay(1400);
  S.ia.busy=false;
  if(S.dev.iaFalha){S.ia.msgs.push({role:'ai',err:true,text:'Não consegui responder agora porque o serviço está sobrecarregado. Sua pergunta não foi descontada. Tente de novo em instantes.',id:nextId()})}
  else{S.ia.usadas++;S.ia.msgs.push({role:'ai',text:respond(q),id:nextId()});logAcao('ia','Fez uma pergunta ao assistente')}
  chatRefresh();const i=$('#chatq');if(i&&!i.disabled)i.focus();
}

function changeMes(d,mode='mes'){if(!canShift(mode,d))return;const cur=rangeOf(mode),t=new Date(cur.y,cur.m0+d*PER[mode].n,1);S.mes={y:t.getFullYear(),m:t.getMonth()};clampMes();render({soft:true})}

    case 'clear-filtros':S.filtro={periodo:S.filtro.periodo==='dash'?'mes':S.filtro.periodo,tipo:'',grupo:'',cat:'',q:''};render({soft:true});break;

    case 'rec-nova':openRecDialog();break;

document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const name=f.dataset.form,btn=$('button[type=submit]',f);
  if(name==='login'){
    const em=f.email.value.trim(),pw=f.senha.value,errs={};
    if(!em)errs.email='Informe o seu e-mail.';else if(!/^\S+@\S+\.\S+$/.test(em))errs.email='Esse e-mail não parece completo. Exemplo: nome@email.com.';
    if(!pw)errs.senha='Informe a sua senha.';
    $('#loginerr').classList.remove('show');
    if(!showErrors(f,errs))return;
    await withLoading(btn,800);
    if(em.toLowerCase()!=='demo@ifo.teste'||pw!=='demo12345'){const x=$('#loginerr');x.classList.add('show');$('span',x).textContent='E-mail ou senha incorretos. Confira os dados e tente de novo.';f.senha.focus();return}
    S.pending={email:em};location.hash='#/verificacao';
  }
  else if(name==='cadastro'){
    const errs={},nome=f.nome.value.trim(),em=f.email.value.trim(),pw=f.senha.value,rd=parseMoney(f.renda.value);
    if(nome.length<2)errs.nome='Informe o seu nome.';
    if(!em)errs.email='Informe o seu e-mail.';else if(!/^\S+@\S+\.\S+$/.test(em))errs.email='Esse e-mail não parece completo. Exemplo: nome@email.com.';
    if(pw.length<8)errs.senha='A senha precisa ter pelo menos 8 caracteres.';
    if(isNaN(rd)||rd<0)errs.renda='Informe a sua renda mensal. Pode ser 0, mas não negativa.';
    if(!showErrors(f,errs))return;
    await withLoading(btn,900);
    S.user.nome=nome.split(' ')[0];S.user.renda=rd;
    location.hash='#/entrar';toast('Conta criada. Entre para continuar.');
  }
  else if(name==='2fa'){
    const api=S.pending.api,code=$$('[data-code]').map(i=>i.value).join(''),err=$('#codeerr'),msg=m=>{err.classList.add('show');$('span',err).textContent=m};
    if(api.expired)return msg('O código expirou. Peça um novo código para continuar.');
    if(api.tent<=0)return msg('Você usou as 5 tentativas. Peça um novo código ou volte ao login.');
    if(code.length<6)return msg('Digite os 6 dígitos do código.');
    await withLoading(btn,700);
    if(code!=='123456'){api.tent=api.tent-1;msg(api.tent>0?`Código incorreto. Você ainda tem ${api.tent} tentativa${api.tent>1?'s':''}.`:'Código incorreto. As tentativas acabaram: peça um novo código.');$$('[data-code]').forEach(i=>i.value='');$('[data-code="0"]').focus();return}
    S.auth=true;S.pending=null;logAcao('acesso','Entrou na conta');const gen=gerarRecs();if(gen)logAcao('rec',`Gerou ${gen} despesa${gen>1?'s':''} recorrente${gen>1?'s':''}`);location.hash='#/painel';toast(`Bem-vindo de volta, ${S.user.nome}.`);
  }
  else if(name==='tx'){
    const id=Number(f.dataset.id)||null,tipo=f.elements.tipo.value,errs={};let cat=f.categoria.value;
    const valor=parseMoney(f.valor.value),data=f.data.value,desc=f.descricao.value.trim(),prev=f.prevista.checked;
    if(cat==='__new'){const nm=f.novacat.value.trim();if(!nm)errs.novacat='Dê um nome para a nova categoria.';else if(allCats(tipo).concat(allCats(tipo==='despesa'?'receita':'despesa')).some(c=>norm(c)===norm(nm)))errs.novacat='Já existe uma categoria com esse nome.';else cat=nm}
    if(!desc)errs.descricao='Descreva a transação em poucas palavras.';
    if(isNaN(valor)||valor<=0)errs.valor='Informe um valor maior que zero.';
    if(!data)errs.data='Escolha a data.';else if(!prev&&data>TODAY_ISO)errs.data='Essa data ainda não chegou. Marque “Ainda não aconteceu” para registrar como prevista.';
    if(!showErrors(f,errs))return;
    await withLoading(btn,600);
    const grupo=tipo==='despesa'?f.grupo.value:null;
    if(f.categoria.value==='__new')S.cats.push({nome:cat,grupo});
    const dados={tipo,grupo,categoria:cat,descricao:desc,valor,data,confirmada:!prev};
    if(id){const t=S.tx.find(x=>x.id===id);Object.assign(t,dados);logAcao('tx',`Editou a transação “${desc}” (${brl(valor)})`);closeDialog();render({soft:true});toast('Alterações salvas.');budgetCheck(t,true)}
    else{const t={id:nextId(),...dados};S.tx.push(t);logAcao('tx',`Criou a transação “${desc}” (${cat}, ${brl(valor)})`);closeDialog();
      const k=data.slice(0,7);if(k>=MES_MIN&&k<=MES_MAX&&k!==selKey()&&location.hash.match(/painel|transacoes|orcamentos/)){S.mes={y:+k.slice(0,4),m:+k.slice(5)-1}}
      render({soft:true});toast(prev?'Transação prevista salva. Confirme quando acontecer.':'Transação salva.');budgetCheck(t)}
  }
  else if(name==='pct'){
    const errs={},v={};let sum=0;
    G.forEach(g=>{const raw=f.elements[g].value.trim(),n=Number(raw);v[g]=n;
      if(raw===''||!Number.isInteger(n))errs[g]='Informe um número inteiro, de 0 a 100.';
      else if(n<0||n>100)errs[g]='Use um valor entre 0 e 100.';else sum+=n});
    if(!Object.keys(errs).length&&sum!==100)errs[G[0]]=`Os três percentuais somam ${sum}%. Ajuste para somar exatamente 100%.`;
    if(!showErrors(f,errs))return;
    await withLoading(btn,500);
    S.pct[selKey()]={...v};logAcao('orc',`Definiu os percentuais de ${selLabel()}: ${G.map(g=>v[g]).join('/')}`);render({soft:true});
    toast(`Percentuais salvos: ${G.map(g=>v[g]).join('/')}. Os meses seguintes herdam esses valores.`);
  }
  else if(name==='rec'){
    const id=Number(f.dataset.id)||null,errs={},desc=f.descricao.value.trim(),valor=parseMoney(f.valor.value),dia=parseInt(f.dia.value,10),ini=f.inicio.value,fim=f.fim.value;
    if(!desc)errs.descricao='Descreva a despesa em poucas palavras.';
    if(isNaN(valor)||valor<=0)errs.valor='Informe um valor maior que zero.';
    if(isNaN(dia)||dia<1||dia>31)errs.dia='Informe um dia de 1 a 31.';
    if(!ini)errs.inicio='Escolha o mês de início.';
    if(fim&&ini&&fim<ini)errs.fim='O fim não pode ser antes do início.';
    if(!showErrors(f,errs))return;await withLoading(btn,500);
    const dados={descricao:desc,categoria:f.categoria.value,grupo:f.grupo.value,valor,dia,inicio:ini,fim};
    let rr;if(id){rr=S.recs.find(x=>x.id===id);Object.assign(rr,dados)}else{rr={id:nextId(),...dados,ativa:true,ultima:null};S.recs.push(rr)}
    const n=gerarRecs();logAcao('rec',`${id?'Editou':'Criou'} a recorrência “${desc}” (${brl(valor)}, dia ${dia})`);closeDialog();S.hlRec=rr.id;render({soft:true});setTimeout(()=>{S.hlRec=null},2500);
    toast(n?`Recorrência salva. Lançamos ${n} despesa${n>1?'s':''} de meses que já venceram. As próximas saem sozinhas.`:id?'Alterações salvas. Valem a partir dos próximos lançamentos.':`Recorrência salva. Ela aparece na lista abaixo e só vira transação em ${fmtData(recNext(rr)||TODAY_ISO)}.`);
  }
  else if(name==='meta'){
    const id=Number(f.dataset.id)||null,m=id?S.metas.find(x=>x.id===id):null,errs={},ti=f.titulo.value.trim(),ob=parseMoney(f.objetivo.value),pz=f.prazo.value;
    const at=m?m.atual:(f.atual.value.trim()?parseMoney(f.atual.value):0);
    if(!ti)errs.titulo='Dê um nome para a meta.';
    else if(S.metas.some(x=>x.id!==id&&norm(x.titulo)===norm(ti)))errs.titulo='Você já tem uma meta com esse nome. Escolha outro nome.';
    if(isNaN(ob)||ob<=0)errs.objetivo='Informe o valor que quer juntar.';
    else if(m&&ob<m.atual)errs.objetivo=`O valor da meta não pode ser menor que o já guardado (${brl(m.atual)}).`;
    if(!pz)errs.prazo='Escolha o mês do prazo.';else if(!m&&pz<='2026-11')errs.prazo='O prazo precisa ser depois de novembro de 2026.';
    if(!m){if(isNaN(at)||at<0)errs.atual='Informe um valor de 0 em diante.';else if(!isNaN(ob)&&at>ob)errs.atual='O valor guardado não pode passar do valor da meta.'}
    if(!showErrors(f,errs))return;await withLoading(btn,500);
    if(m){Object.assign(m,{titulo:ti,objetivo:ob,prazo:pz,concluida:m.atual>=ob});logAcao('meta',`Editou a meta “${ti}”`);closeDialog();render({soft:true});toast('Meta atualizada.')}
    else{S.metas.push({id:nextId(),titulo:ti,objetivo:ob,atual:at,prazo:pz,concluida:at>=ob});logAcao('meta',`Criou a meta “${ti}” (${brl(ob)})`);closeDialog();render({soft:true});toast('Meta criada.')}
  }
  else if(name==='metaadd'){
    const m=S.metas.find(x=>x.id===Number(f.dataset.id)),v=parseMoney(f.valor.value),errs={};
    if(isNaN(v)||v<=0)errs.valor='Informe um valor maior que zero.';if(!showErrors(f,errs))return;await withLoading(btn,400);
    m.atual=Math.min(m.objetivo,m.atual+v);if(m.atual>=m.objetivo)m.concluida=true;logAcao('meta',`Adicionou ${brl(v)} à meta “${m.titulo}”`);closeDialog();render({soft:true});toast(m.concluida?`Meta “${m.titulo}” concluída. Parabéns!`:`${brl(v)} adicionados à meta.`);
  }
  else if(name==='perfil'){
    const errs={},nome=f.nome.value.trim(),rd=parseMoney(f.renda.value),per=f.periodo.value;
    if(nome.length<2)errs.nome='Informe o seu nome.';if(isNaN(rd)||rd<0)errs.renda='Informe a sua renda mensal. Pode ser 0, mas não negativa.';
    if(!showErrors(f,errs))return;
    if(nome===S.user.nome&&rd===S.user.renda&&per===S.user.periodo){toast('Nada mudou, então não há o que salvar.',{tipo:'info'});return}
    await withLoading(btn,600);Object.assign(S.user,{nome,renda:rd,periodo:per});S.anaPer=null;logAcao('acesso','Atualizou o perfil');render({soft:true});toast(rd>0?'Perfil atualizado. Os limites do orçamento já usam a nova renda.':'Perfil atualizado. Sem renda, nenhum limite é calculado.');
  }
  else if(name==='chat'){const i=$('#chatq');const q=i.value;i.value='';ask(q)}
});

document.addEventListener('keydown',e=>{
  if(e.key==='n'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&S.auth&&!dlg.open&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openTxDialog()}
});

/* ---------- início ---------- */
try{const t=localStorage.getItem('ifo-theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}
if(!location.hash)location.hash='#/entrar';
render();
</script>
</body>
</html>
